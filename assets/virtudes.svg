<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Mis virtudes. Trabajo en equipo: Sumo, ayudo y me comunico.. Responsable: Cumplo con lo que me toca, a tiempo.. Constante: Sigo paso a paso hasta que funciona.. Curioso: Aprendo lo que el proyecto necesite.">
  <style>
    .trazo { stroke-dasharray: 100; animation: dibujar 8s ease-in-out infinite backwards; }
    @keyframes dibujar { 0% { stroke-dashoffset: 100; } 18%, 100% { stroke-dashoffset: 0; } }
    .activa { opacity: 0; animation: activa 8s ease-in-out infinite backwards; }
    @keyframes activa { 0% { opacity: 0; } 8%, 22% { opacity: 1; } 32%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .trazo { animation: none; stroke-dasharray: none; } .activa { animation: none; } }
  </style>
