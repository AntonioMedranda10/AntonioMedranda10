<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="SEP 2025: Primer proyecto, ReservaManta: canchas. OCT 2025: Reservas ULEAM, TypeORM y SQLite. NOV 2025: APIs, NestJS y Python. ENE 2026: Servidores web, Docker y prácticas. JUL 2026: EventosManta, App móvil + Laravel. SEP 2026: E-commerce 5 nodos, Backend NestJS. OCT 2026: Simplex Paso a Paso, Algoritmos y diseño.">
  <style>
    .avance { stroke-dasharray: 980; animation: trazar 10s ease-in-out infinite; }
    @keyframes trazar { 0% { stroke-dashoffset: 980; } 70%, 92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 980; } }
    .hito { transform-box: fill-box; transform-origin: center; animation: encender 10s ease-out infinite backwards; }
    @keyframes encender { 0% { transform: scale(1.5); } 6% { transform: scale(1); } 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .avance { animation: none; stroke-dasharray: none; } .hito { animation: none; } }
  </style>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#25272b" /><stop offset="1" stop-color="#1a1c20" /></linearGradient>
    <linearGradient id="borde" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2c36e" stop-opacity=".7" /><stop offset=".5" stop-color="#ffffff" stop-opacity=".06" /><stop offset="1" stop-color="#95c11e" stop-opacity=".35" /></linearGradient>

  </defs>
  <rect width="1200" height="200" rx="24" fill="url(#fondo)" />
  <rect x=".5" y=".5" width="1199" height="199" rx="23.5" fill="none" stroke="url(#borde)" />
