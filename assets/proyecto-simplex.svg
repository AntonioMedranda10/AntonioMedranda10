<svg xmlns="http://www.w3.org/2000/svg" width="600" height="264" viewBox="0 0 600 264" role="img" aria-label="Simplex Paso a Paso: Calculadora del método simplex y Dos Fases que explica cada operación con fracciones exactas. Hice el motor de Dos Fases y el diseño.">
  <style>
    .luz { animation: luz 7s ease-in-out infinite; } @keyframes luz { 50% { transform: translate(40px, 20px); } }
    .vivo { animation: vivo 2s ease-in-out infinite; } @keyframes vivo { 50% { opacity: .7; } }
    @media (prefers-reduced-motion: reduce) { .luz, .vivo { animation: none; } }
  </style>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#25272b" /><stop offset="1" stop-color="#1a1c20" /></linearGradient>
    <linearGradient id="borde" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2c36e" stop-opacity=".7" /><stop offset=".5" stop-color="#ffffff" stop-opacity=".06" /><stop offset="1" stop-color="#95c11e" stop-opacity=".35" /></linearGradient>
    <radialGradient id="luz"><stop offset="0" stop-color="#e2c36e" stop-opacity="0.32" /><stop offset=".55" stop-color="#e2c36e" stop-opacity="0.144" /><stop offset="1" stop-color="#e2c36e" stop-opacity="0" /></radialGradient>
  </defs>
  <clipPath id="c"><rect width="600" height="264" rx="24" /></clipPath>
  <g clip-path="url(#c)"><rect width="600" height="264" fill="url(#fondo)" /><circle class="luz" cx="80" cy="40" r="150" fill="url(#luz)" /></g>
  <rect x="0.5" y="0.5" width="599" height="263" rx="23.5" fill="none" stroke="url(#borde)" />
