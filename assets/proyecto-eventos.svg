  <text x="96" y="52" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="800" fill="#ffffff">EventosManta</text>
  <text x="96" y="76" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#e2c36e">App móvil + API</text>
