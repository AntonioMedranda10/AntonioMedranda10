<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Antonio Medranda</title>
  <desc id="d">Hola, soy Antonio Medranda, estudiante de Ingeniería de Software en la ULEAM, de Manta, Ecuador. Desarrollo backends con NestJS, construyo apps con React y React Native, y trabajo mejor en equipo.</desc>
  <defs>
    <clipPath id="marco"><rect width="1200" height="420" rx="28" /></clipPath>
    <filter id="difuminar" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55" /></filter>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18" /></filter>
    <linearGradient id="nombre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.45" stop-color="#ffffff" />
      <stop offset="0.5" stop-color="#f3dc9a" />
      <stop offset="0.55" stop-color="#ffffff" />
      <stop offset="1" stop-color="#ffffff" />
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; 1 0" keyTimes="0; 0.4; 1" dur="6s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dc9a" />
      <stop offset="1" stop-color="#e2c36e" />
    </linearGradient>
    <pattern id="puntos" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".06" />
    </pattern>
    <path id="orbita" d="M940 60 a150 150 0 1 1 0 300 a150 150 0 1 1 0 -300" />
  </defs>

  <g clip-path="url(#marco)">
    <rect width="1200" height="420" fill="#16181c" />
    <g filter="url(#difuminar)">
      <circle cx="260" cy="120" r="190" fill="#e2c36e" fill-opacity=".34">
        <animateTransform attributeName="transform" type="translate" values="0 0; 120 60; -40 90; 0 0" dur="18s" repeatCount="indefinite" />
      </circle>
      <circle cx="640" cy="400" r="170" fill="#e30614" fill-opacity=".18">
        <animateTransform attributeName="transform" type="translate" values="0 0; -110 -40; 60 -70; 0 0" dur="22s" repeatCount="indefinite" />
      </circle>
      <circle cx="1100" cy="60" r="160" fill="#95c11e" fill-opacity=".15">
        <animateTransform attributeName="transform" type="translate" values="0 0; -80 70; 30 40; 0 0" dur="20s" repeatCount="indefinite" />
      </circle>
    </g>
    <rect width="1200" height="420" fill="url(#puntos)" />
  </g>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity=".08" />

  <!-- Nombre -->
  <text x="62" y="84" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="600" fill="#e2c36e">Hola, soy</text>
  <text x="56" y="160" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="80" font-weight="800" fill="url(#nombre)" letter-spacing="-1.5">Antonio</text>
  <text x="56" y="236" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="80" font-weight="800" fill="url(#nombre)" letter-spacing="-1.5">Medranda</text>

  <!-- Línea que se escribe sola -->
  <rect x="58" y="246" width="560" height="34" rx="10" fill="#000000" fill-opacity=".28" />
  <text x="72" y="270" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="20" font-weight="700" fill="#95c11e">&gt;</text>
  
    <clipPath id="escribir0"><rect x="96" y="246" height="34" width="0">
      <animate attributeName="width" values="0;0;332;332;0;0" keyTimes="0;0.0;0.14;0.31;0.311;1" dur="12s" repeatCount="indefinite" />
    </rect></clipPath>
    <text clip-path="url(#escribir0)" x="96" y="270" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="20" fill="#ffffff">desarrollo backends con NestJS</text>
    <rect x="98" y="251" width="11" height="24" fill="#e2c36e" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0;0.001;0.31;0.311;1" dur="12s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;332 0;332 0;0 0;0 0" keyTimes="0;0.0;0.14;0.31;0.311;1" dur="12s" repeatCount="indefinite" />
    </rect>
    <clipPath id="escribir1"><rect x="96" y="246" height="34" width="0">
      <animate attributeName="width" values="0;0;431;431;0;0" keyTimes="0;0.3333;0.4733;0.6433;0.6443;1" dur="12s" repeatCount="indefinite" />
    </rect></clipPath>
    <text clip-path="url(#escribir1)" x="96" y="270" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="20" fill="#ffffff">construyo apps con React y React Native</text>
    <rect x="98" y="251" width="11" height="24" fill="#e2c36e" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3343;0.6433;0.6443;1" dur="12s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;431 0;431 0;0 0;0 0" keyTimes="0;0.3333;0.4733;0.6433;0.6443;1" dur="12s" repeatCount="indefinite" />
    </rect>
    <clipPath id="escribir2"><rect x="96" y="246" height="34" width="0">
      <animate attributeName="width" values="0;0;254;254;0;0" keyTimes="0;0.6667;0.8067;0.9767;0.9777;1" dur="12s" repeatCount="indefinite" />
    </rect></clipPath>
    <text clip-path="url(#escribir2)" x="96" y="270" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="20" fill="#ffffff">trabajo mejor en equipo</text>
    <rect x="98" y="251" width="11" height="24" fill="#e2c36e" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.6677;0.9767;0.9777;1" dur="12s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;254 0;254 0;0 0;0 0" keyTimes="0;0.6667;0.8067;0.9767;0.9777;1" dur="12s" repeatCount="indefinite" />
    </rect>

  <!-- Datos -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600">
    <rect x="60" y="306" width="196" height="34" rx="17" fill="#ffffff" fill-opacity=".1" />
    <text x="158" y="328" fill="#ffffff" text-anchor="middle">Ingeniería de Software</text>
    <rect x="266" y="306" width="86" height="34" rx="17" fill="#ffffff" fill-opacity=".1" />
    <text x="309" y="328" fill="#ffffff" text-anchor="middle">ULEAM</text>
    <rect x="362" y="306" width="164" height="34" rx="17" fill="#e2c36e" />
    <text x="444" y="328" fill="#16181c" text-anchor="middle">Trabajo en equipo</text>
  </g>
  <circle cx="66" cy="370" r="5" fill="#e2c36e" />
  <text x="80" y="376" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#c9cbd0">Manta, Ecuador</text>

  <!-- Avatar con órbitas -->
  <circle cx="940" cy="210" r="100" fill="#e2c36e" fill-opacity=".35" filter="url(#brillo)">
    <animate attributeName="r" values="92;108;92" dur="4s" repeatCount="indefinite" />
  </circle>
  <g>
    <circle cx="940" cy="210" r="118" fill="none" stroke="#e2c36e" stroke-opacity=".6" stroke-width="2" stroke-dasharray="4 10" stroke-linecap="round" />
    <animateTransform attributeName="transform" type="rotate" from="0 940 210" to="360 940 210" dur="30s" repeatCount="indefinite" />
  </g>
  <circle cx="940" cy="210" r="150" fill="none" stroke="#ffffff" stroke-opacity=".07" />
  <circle cx="940" cy="210" r="186" fill="none" stroke="#ffffff" stroke-opacity=".05" />
  <g>
    <text font-family="Consolas,'SF Mono',Menlo,monospace" font-size="14" font-weight="700" fill="#c9cbd0" letter-spacing="2.5">
      <textPath href="#orbita">TYPESCRIPT · NESTJS · REACT · PYTHON · LARAVEL · DOCKER · POSTGRESQL · VITE ·</textPath>
    </text>
    <animateTransform attributeName="transform" type="rotate" from="0 940 210" to="-360 940 210" dur="45s" repeatCount="indefinite" />
  </g>
  <circle cx="940" cy="210" r="86" fill="url(#avatar)" />
  <circle cx="940" cy="210" r="86" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="2" />
  <text x="940" y="234" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="800" fill="#16181c" text-anchor="middle" letter-spacing="-2">AM</text>
  <!-- Tres puntos que giran: mostaza y los colores de la ULEAM -->
  <g><circle cx="1126" cy="210" r="8" fill="#e2c36e" />
    <animateTransform attributeName="transform" type="rotate" from="0 940 210" to="360 940 210" dur="12s" repeatCount="indefinite" /></g>
  <g><circle cx="754" cy="210" r="6" fill="#e30614" />
    <animateTransform attributeName="transform" type="rotate" from="0 940 210" to="360 940 210" dur="18s" repeatCount="indefinite" /></g>
  <g><circle cx="940" cy="396" r="6" fill="#95c11e" />
    <animateTransform attributeName="transform" type="rotate" from="0 940 210" to="-360 940 210" dur="15s" repeatCount="indefinite" /></g>
</svg>
