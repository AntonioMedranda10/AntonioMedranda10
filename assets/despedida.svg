    <g transform="translate(0 66)"><path class="ola1" d="M0 120 Q30 148 60 120 Q90 92 120 120 Q150 148 180 120 Q210 92 240 120 Q270 148 300 120 Q330 92 360 120 Q390 148 420 120 Q450 92 480 120 Q510 148 540 120 Q570 92 600 120 Q630 148 660 120 Q690 92 720 120 Q750 148 780 120 Q810 92 840 120 Q870 148 900 120 Q930 92 960 120 Q990 148 1020 120 Q1050 92 1080 120 Q1110 148 1140 120 Q1170 92 1200 120 Q1230 148 1260 120 Q1290 92 1320 120 Q1350 148 1380 120 Q1410 92 1440 120 Q1470 148 1500 120 Q1530 92 1560 120 Q1590 148 1620 120 Q1650 92 1680 120 Q1710 148 1740 120 Q1770 92 1800 120 Q1830 148 1860 120 Q1890 92 1920 120 Q1950 148 1980 120 Q2010 92 2040 120 Q2070 148 2100 120 Q2130 92 2160 120 Q2190 148 2220 120 Q2250 92 2280 120 Q2310 148 2340 120 Q2370 92 2400 120 V200 H0 Z" fill="#e2c36e" fill-opacity=".16" /></g>
