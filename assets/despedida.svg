<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Paso a paso, como el simplex: cada iteración, un poco mejor.">
  <style>
    .ola1 { animation: mover 9s linear infinite; }
    .ola2 { animation: mover 14s linear infinite reverse; }
    @keyframes mover { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
    .frase { animation: aparecer 6s ease-in-out infinite; }
    @keyframes aparecer { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .ola1, .ola2, .frase { animation: none; } }
  </style>
  <clipPath id="marco"><rect width="1200" height="200" rx="24" /></clipPath>
