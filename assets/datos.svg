    <text x="38" y="124" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#ffffff">nivel de Ingeniería</text>
    <text x="38" y="148" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#c9cbd0">de Software</text>
  </g><g class="ficha" style="animation-delay:-1.5s">
    <rect x="309" y="12" width="282" height="156" rx="22" fill="url(#fondo)" />
    <rect x="309.5" y="12.5" width="281" height="155" rx="21.5" fill="none" stroke="url(#borde)" />
    <circle cx="369" cy="40" r="90" fill="url(#luz)" />
