<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-label="8.º nivel de Ingeniería de Software. 3 lenguajes de backend: TypeScript, Python y PHP. 420+ pruebas automáticas en Simplex Paso a Paso. 11 repositorios públicos.">
  <style>.ficha { animation: subir 6s ease-in-out infinite; } @keyframes subir { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } } @media (prefers-reduced-motion: reduce) { .ficha { animation: none; } }</style>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#25272b" /><stop offset="1" stop-color="#1a1c20" /></linearGradient>
    <linearGradient id="borde" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2c36e" stop-opacity=".7" /><stop offset=".5" stop-color="#ffffff" stop-opacity=".06" /><stop offset="1" stop-color="#95c11e" stop-opacity=".35" /></linearGradient>
    <radialGradient id="luz"><stop offset="0" stop-color="#e2c36e" stop-opacity="0.3" /><stop offset=".55" stop-color="#e2c36e" stop-opacity="0.135" /><stop offset="1" stop-color="#e2c36e" stop-opacity="0" /></radialGradient>
  </defs>
