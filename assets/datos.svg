    <text x="335" y="148" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#c9cbd0">TypeScript, Python y PHP</text>
  </g><g class="ficha" style="animation-delay:-3.0s">
    <rect x="606" y="12" width="282" height="156" rx="22" fill="url(#fondo)" />
    <rect x="606.5" y="12.5" width="281" height="155" rx="21.5" fill="none" stroke="url(#borde)" />
    <circle cx="666" cy="40" r="90" fill="url(#luz)" />
    <text x="632" y="88" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="800" fill="#e2c36e">420+</text>
    <text x="632" y="124" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#ffffff">pruebas automáticas</text>
    <text x="632" y="148" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#c9cbd0">en Simplex Paso a Paso</text>
